name: Refresh Expo dependency lockfile
on:
  push:
    branches:
      - fix/expo-dependency-check-20261008
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve updated SDK versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Verify Expo versions
        run: npx expo install --check
      - name: Run unit tests
        run: npm test
      - name: Commit the generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate npm lockfile for Expo SDK 57"
            git push origin HEAD:fix/expo-dependency-check-20261008
          fi
