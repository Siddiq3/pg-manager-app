name: Mobile CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Expo dependency and native release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate Expo dependency versions
        run: npx expo install --check
      - name: Expo project diagnostics
        run: npx expo-doctor
      - name: Verify Android JS export
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
        run: npx expo export --platform android --output-dir /tmp/pg-manager-dist --non-interactive
      - name: Verify unsigned native release AAB
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
        run: cd android && ./gradlew :app:bundleRelease
